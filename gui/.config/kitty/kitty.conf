# font
font_family      MesloLGS NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14

# window
background_opacity      0.90
background_blur         30
window_padding_width    5 0
hide_window_decorations titlebar-only

# shift+enter -> ESC+CR so claude code and codex both insert a newline
map shift+enter send_text all \x1b\r

# use tmux for panes and tabs; pass these shortcuts to terminal applications
map cmd+enter no_op
map kitty_mod+enter no_op
map cmd+t no_op
map kitty_mod+t no_op
map cmd+n no_op
map kitty_mod+n no_op
map kitty_mod+l no_op

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME
